# Edge Functions config — InstalecJG

# WhatsApp webhooks are called by Meta / Twilio without a Supabase user JWT.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.twilio-whatsapp-webhook]
verify_jwt = false

[functions.submit-lead]
verify_jwt = false

# Telegram calls the webhook without a Supabase JWT; auth is the secret_token header.
[functions.telegram-webhook]
verify_jwt = false
